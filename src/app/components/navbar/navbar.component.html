<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container navbar__inner">
    <a href="#hero" class="navbar__logo" (click)="scrollTo('#hero', $event)">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-name">AB</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <ul class="navbar__links" [class.open]="menuOpen">
      @for (link of navLinks; track link.href) {
        <li>
          <a [href]="link.href" (click)="scrollTo(link.href, $event)">{{ link.label }}</a>
        </li>
      }
      <li>
        <a href="assets/cv/BOULEBENE Abdelkader CV.pdf" target="_blank" class="btn btn--primary btn--sm">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          CV
        </a>
      </li>
    </ul>

    <button class="navbar__burger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
